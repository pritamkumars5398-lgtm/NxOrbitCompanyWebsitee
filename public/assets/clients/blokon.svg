<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 65" fill="none">
  <defs>
    <linearGradient id="blokBadge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="blokText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  
  <!-- Hexagon badge -->
  <polygon points="32,8 52,18 52,42 32,52 12,42 12,18" fill="url(#blokBadge)" rx="4" />
  
  <!-- Stacked 3D cubes -->
  <!-- Top cube -->
  <polygon points="32,15 42,20 32,25 22,20" fill="#e2e8f0" stroke="#475569" stroke-width="0.8" />
  <polygon points="22,20 32,25 32,32 22,27" fill="#cbd5e1" stroke="#475569" stroke-width="0.8" />
  <polygon points="32,25 42,20 42,27 32,32" fill="#94a3b8" stroke="#475569" stroke-width="0.8" />
  <!-- Bottom cube -->
  <polygon points="22,28 32,33 32,44 22,39" fill="#cbd5e1" stroke="#475569" stroke-width="0.8" />
  <polygon points="32,33 42,28 42,39 32,44" fill="#94a3b8" stroke="#475569" stroke-width="0.8" />

  <!-- BlokOn Wordmark -->
  <text x="66" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="url(#blokText)" letter-spacing="-0.5">BlokOn</text>
</svg>
